# awsm-renderer-kit: the settings and stats code every awsm-renderer app
# shares. See README.md.
[workspace]
resolver = "2"
members = ["crates/web", "crates/settings", "crates/stats", "examples/ui-harness"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/awsm-fun/awsm-renderer-kit"
rust-version = "1.85"

[workspace.dependencies]
awsm-renderer-kit-web = { path = "crates/web", version = "0.1.2" }

# The renderer, with its default features: 0.46.0 does not build without
# them (`animation` is referenced unconditionally). Cargo unifies features,
# so an app keeps whatever else it turns on.
awsm-renderer = "0.46.0"
awsm-renderer-scene = { version = "0.46.0", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = "0.3.107"
